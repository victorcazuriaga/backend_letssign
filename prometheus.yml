scrape_configs:
  - job_name: 'mongodb'
    static_configs:
      - targets: ['host.docker.internal:9216']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['host.docker.internal:15692']

  - job_name: 'microservices'
    scrape_interval: 15s
    static_configs:
      - targets:
          [
            'host.docker.internal:3001',
            'host.docker.internal:3002',
            'host.docker.internal:3003',
            'host.docker.internal:3004',
          ]
    metrics_path: '/metrics'
