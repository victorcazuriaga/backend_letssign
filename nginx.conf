worker_processes 1;

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        server_name your-domain.com;

        location /auth/metrics {
            allow 127.0.0.1;
            allow 172.17.0.0/16;
            deny all;
            proxy_pass http://localhost:3001/auth/metrics;
            }

        location /notification/metrics {
            allow 127.0.0.1;
            allow 172.17.0.0/16; 
            deny all;
            proxy_pass http://localhost:3002/notification/metrics;
            }
            
        location /otp/metrics {
            allow 127.0.0.1;
            allow 172.17.0.0/16; 
            deny all;
            proxy_pass http://localhost:3003/otp/metrics;
            }
        
         location /auth/health {
            allow 127.0.0.1;
            allow 172.17.0.0/16;
            deny all;
            proxy_pass http://localhost:3001/auth/health;
        }

        location /notification/health {
            allow 127.0.0.1;
            allow 172.17.0.0/16;
            deny all;
            proxy_pass http://localhost:3002/notification/health;
        }

        location /otp/health {
            allow 127.0.0.1;
            allow 172.17.0.0/16;
            deny all;
            proxy_pass http://localhost:3003/otp/health;
        }

        
        location /auth/ {
            proxy_pass http://auth:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        location /notification/ {
            proxy_pass http://notification:3002;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        location /otp/ {
            proxy_pass http://otp:3003;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}