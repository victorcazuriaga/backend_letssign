version: '3'

services:
  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '80:80'
    depends_on:
      - auth
      - notification
      - otp
      - document
    networks:
      - nest_network
  auth:
    build:
      context: .
      dockerfile: ./apps/auth/Dockerfile
      target: development
    command: npm run start:dev auth
    environment:
      - MONGODB_URI=mongodb://mongodb-primary:27017
      - RABBIT_MQ_URI=amqp://rabbitmq:5672
    env_file:
      - ./apps/auth/.env
    depends_on:
      - mongodb-primary
      - mongodb-secondary
      - mongodb-arbiter
      - rabbitmq
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - '3001:3001'
    networks:
      - nest_network
  otp:
    build:
      context: .
      dockerfile: ./apps/otp/Dockerfile
      target: development
    command: npm run start:dev otp
    environment:
      - MONGODB_URI=mongodb://mongodb-primary:27017
      - RABBIT_MQ_URI=amqp://rabbitmq:5672
    env_file:
      - ./apps/otp/.env
    depends_on:
      - mongodb-primary
      - mongodb-secondary
      - mongodb-arbiter
      - notification
      - rabbitmq
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - '3003:3003'

    networks:
      - nest_network
  notification:
    build:
      context: .
      dockerfile: ./apps/notification/Dockerfile
      target: development
    command: npm run start:dev notification
    environment:
      - MONGODB_URI=mongodb://mongodb-primary:27017
      - RABBIT_MQ_URI=amqp://rabbitmq:5672
    env_file:
      - ./apps/notification/.env
    depends_on:
      - mongodb-primary
      - mongodb-secondary
      - mongodb-arbiter
      - rabbitmq
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - '3002:3002'
    networks:
      - nest_network

  document:
    build:
      context: .
      dockerfile: ./apps/document/Dockerfile
      target: development
    command: npm run start:dev document
    environment:
      - MONGODB_URI=mongodb://mongodb-primary:27017
      - RABBIT_MQ_URI=amqp://rabbitmq:5672
    env_file:
      - ./apps/document/.env
    depends_on:
      - mongodb-primary
      - mongodb-secondary
      - mongodb-arbiter
      - rabbitmq
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - '3004:3004'
    networks:
      - nest_network
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - '5672:5672'
      - '15672:15672'
      - '5552:5552'
    environment:
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbitmq_stream advertised_host localhost
    command: >
      sh -c "
      rabbitmq-plugins enable --offline rabbitmq_stream &&
      rabbitmq-plugins enable --offline rabbitmq_prometheus &&
      rabbitmq-server"
    networks:
      - nest_network
  mongodb-primary:
    image: mongo:latest
    environment:
      - MONGODB_ADVERTISED_HOSTNAME=mongodb-primary
      - MONGODB_REPLICA_SET_MODE=primary
      - MONGODB_ROOT_PASSWORD=password123
      - MONGODB_REPLICA_SET_KEY=replicasetkey123
    volumes:
      - 'mongodb_master_data:/data/db'
    ports:
      - '27017:27017'
    networks:
      - nest_network

  mongodb-secondary:
    image: mongo:latest
    depends_on:
      - mongodb-primary
    environment:
      - MONGODB_ADVERTISED_HOSTNAME=mongodb-secondary
      - MONGODB_REPLICA_SET_MODE=secondary
      - MONGODB_INITIAL_PRIMARY_HOST=mongodb-primary
      - MONGODB_INITIAL_PRIMARY_ROOT_PASSWORD=password123
      - MONGODB_REPLICA_SET_KEY=replicasetkey123
    networks:
      - nest_network

  mongodb-arbiter:
    image: mongo:latest
    depends_on:
      - mongodb-primary
    environment:
      - MONGODB_ADVERTISED_HOSTNAME=mongodb-arbiter
      - MONGODB_REPLICA_SET_MODE=arbiter
      - MONGODB_INITIAL_PRIMARY_HOST=mongodb-primary
      - MONGODB_INITIAL_PRIMARY_ROOT_PASSWORD=password123
      - MONGODB_REPLICA_SET_KEY=replicasetkey123
    networks:
      - nest_network
  mongodb-exporter:
    image: bitnami/mongodb-exporter:latest
    environment:
      - MONGODB_URI=mongodb://mongodb-primary:27017
      - MONGODB_PASSWORD=password123
    command:
      - --log.level=info
      - --web.listen-address=:9216
      - --collector.collstats
      - --collector.indexstats
      - --collector.dbstats
      - --collector.replicasetstatus
      - --collector.topmetrics
      - --collector.currentopmetrics
    ports:
      - '9216:9216'
    networks:
      - nest_network
    depends_on:
      - mongodb-primary
      - mongodb-secondary
      - mongodb-arbiter
  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - '9090:9090'
    networks:
      - nest_network

  grafana:
    image: grafana/grafana
    ports:
      - '3000:3000'
    networks:
      - nest_network

volumes:
  mongodb_master_data:
    driver: local
networks:
  nest_network:
    driver: bridge
